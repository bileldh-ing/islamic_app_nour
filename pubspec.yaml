name: noor
description: "نور — Quran, prayer times, Qibla, azkar and duas. Premium liquid-glass Islamic app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any
  adhan_dart: any
  geolocator: any
  geocoding: any
  flutter_compass: any
  flutter_map: any
  latlong2: any
  flutter_local_notifications: any
  timezone: any
  flutter_timezone: any
  shared_preferences: any
  hijri: any
  intl: any
  just_audio: any
  http: any
  share_plus: any
  scrollable_positioned_list: ^0.3.8
  phosphor_flutter:
    path: packages/phosphor_flutter
  url_launcher: any
  package_info_plus: any
  wakelock_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#06141B"
    theme_color: "#06141B"
