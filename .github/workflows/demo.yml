name: Screenshots, demo video & live web demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**', 'web/**', 'scripts/demo/**', 'pubspec.yaml']

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build web
        run: flutter build web --release --base-href /islamic_app_nour/
      - name: Serve
        run: |
          mkdir -p site && cp -r build/web site/islamic_app_nour
          (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture screenshots & video
        working-directory: scripts/demo
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium
          node capture.mjs http://localhost:8080/islamic_app_nour/ ../../docs/media
      - name: Encode video & GIF
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          cd docs/media
          IN="-f concat -safe 0 -i raw/demo.ffconcat"
          # Full-frame, phone-shaped output (no cropping or padding).
          ffmpeg -y $IN -c:v libx264 -pix_fmt yuv420p -crf 20 -preset slow -movflags +faststart -vf "fps=30,scale=824:1830:flags=lanczos" demo.mp4
          ffmpeg -y $IN -vf "fps=10,scale=360:-1:flags=lanczos,palettegen=stats_mode=diff" palette.png
          ffmpeg -y $IN -i palette.png -lavfi "fps=10,scale=360:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=4" demo.gif
          for f in demo.mp4 demo.gif; do ffprobe -v error -show_entries stream=width,height -of csv=p=0 $f; done
          rm -rf raw palette.png
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: noor-media
          path: docs/media
      - name: Commit media
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          git diff --cached --quiet || git commit -m "docs: refresh app screenshots and demo [skip ci]"
          git stash -u || true
          git pull --rebase origin main && git push origin HEAD:main
      - name: Publish live web demo (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
