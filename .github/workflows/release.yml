name: Release (Play Store & App Store)

# Push a tag like v1.0.0 to ship. Each store job runs only when its secrets exist.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android — signed AAB/APK + Google Play
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Configure upload keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS
      - name: Build app bundle & APK
        run: |
          flutter build appbundle --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ needs.meta.outputs.build }}
          flutter build apk --release --build-name=${{ needs.meta.outputs.version }} --build-number=${{ needs.meta.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: noor-android-${{ needs.meta.outputs.version }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != '' && env.KEYSTORE_B64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bileldh.noor
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    name: iOS — signed IPA + TestFlight
    needs: [meta, test]
    runs-on: macos-latest
    env:
      P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when Apple secrets are missing
        if: env.P12_B64 == ''
        run: echo "::warning::iOS signing secrets not set — skipping App Store build. See docs/RELEASE.md."
      - uses: subosito/flutter-action@v2
        if: env.P12_B64 != ''
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install certificate & provisioning profile
        if: env.P12_B64 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
      - name: Configure manual signing
        if: env.P12_B64 != ''
        run: python3 scripts/ios_manual_signing.py "${{ secrets.APPLE_TEAM_ID }}" "$PROFILE_NAME"
      - name: Build IPA
        if: env.P12_B64 != ''
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --build-name=${{ needs.meta.outputs.version }} --build-number=${{ needs.meta.outputs.build }}
      - uses: actions/upload-artifact@v4
        if: env.P12_B64 != ''
        with:
          name: noor-ios-${{ needs.meta.outputs.version }}
          path: build/ios/ipa/*.ipa
      - name: Upload to TestFlight
        if: env.P12_B64 != ''
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/noor.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Clean keychain
        if: always() && env.P12_B64 != ''
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db || true
