<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Plex; src: url(../../assets/fonts/IBMPlexSansArabic-Regular.ttf); font-weight: 400; }
@font-face { font-family: Plex; src: url(../../assets/fonts/IBMPlexSansArabic-Medium.ttf); font-weight: 500; }
@font-face { font-family: Plex; src: url(../../assets/fonts/IBMPlexSansArabic-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Plex; src: url(../../assets/fonts/IBMPlexSansArabic-Bold.ttf); font-weight: 700; }
@font-face { font-family: Amiri; src: url(../../assets/fonts/Amiri-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; background: transparent; font-family: Plex, sans-serif; }
.hidden { display: none !important; }

/* ---------- background 1920x1080 ---------- */
#bg { width: 1920px; height: 1080px; position: relative; overflow: hidden;
  background: radial-gradient(1200px 800px at 85% 10%, rgba(34,197,154,.28), transparent 60%),
              radial-gradient(900px 700px at 10% 90%, rgba(226,184,102,.20), transparent 60%),
              radial-gradient(800px 600px at 50% 50%, rgba(139,108,246,.10), transparent 70%),
              linear-gradient(160deg, #1d2438 0%, #0e1222 55%, #070a14 100%); }
#bg svg { position: absolute; inset: 0; opacity: .07; }
#bg .vignette { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, transparent 55%, rgba(0,0,0,.55)); }
#bg.light { background: radial-gradient(1200px 800px at 85% 10%, rgba(34,197,154,.25), transparent 60%),
              radial-gradient(900px 700px at 10% 90%, rgba(217,168,78,.22), transparent 60%),
              linear-gradient(160deg, #f6f8fc 0%, #e6ebf3 100%); }
#bg.light svg { opacity: .09; }
#bg.light .vignette { background: radial-gradient(1400px 900px at 50% 45%, transparent 60%, rgba(30,42,74,.12)); }

/* ---------- phone frame (screen 408x884, transparent hole) ---------- */
#frame { width: 448px; height: 924px; position: relative; }
#frame .body { position: absolute; inset: 0; border-radius: 74px;
  background: linear-gradient(145deg, #3b4152, #12151d 40%, #2a2f3c 70%, #0b0d12);
  -webkit-mask: radial-gradient(#000 0 0) content-box exclude, radial-gradient(#000 0 0); padding: 20px; box-sizing: border-box; }
#frame .rim { position: absolute; inset: 2px; border-radius: 72px; border: 2px solid rgba(255,255,255,.18); }
#frame .inner { position: absolute; inset: 18px; border-radius: 58px; box-shadow: 0 0 0 3px #05060a; }
#frame .island { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; }
#frame .btn { position: absolute; background: linear-gradient(90deg,#2a2f3c,#4a5163); border-radius: 3px; width: 5px; }

/* ---------- screen mask (white rounded rect) ---------- */
#mask { width: 408px; height: 884px; border-radius: 56px; background: #fff; }

/* ---------- caption ---------- */
.cap { width: 760px; padding: 0; color: #fff; }
.cap .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 40px;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22); font-size: 24px; font-weight: 600; color: #7ef0cf; backdrop-filter: blur(10px); }
.cap h1 { font-size: 78px; line-height: 1.12; margin: 28px 0 18px; font-weight: 700; letter-spacing: -.5px; }
.cap p { font-size: 32px; line-height: 1.6; margin: 0; color: rgba(255,255,255,.78); font-weight: 400; }
.cap .feats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.cap .feat { padding: 12px 22px; border-radius: 30px; font-size: 24px; font-weight: 500; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.9); }
.cap.light { color: #111827; } .cap.light p { color: #4b5565; } .cap.light .eyebrow { color: #0f8f6e; background: rgba(255,255,255,.7); border-color: #fff; }
.cap.light .feat { background: rgba(255,255,255,.7); border-color: #fff; color: #111827; }

/* ---------- title cards ---------- */
.title { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; }
.title img { width: 190px; height: 190px; border-radius: 46px; box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.15); }
.title .name { font-family: Amiri, serif; font-size: 150px; line-height: 1.2; margin-top: 26px;
  background: linear-gradient(180deg, #fff3cf, #e2b866 60%, #b8862f); -webkit-background-clip: text; color: transparent; }
.title .tag { font-size: 40px; color: rgba(255,255,255,.85); margin-top: 6px; }
.title .sub { font-size: 26px; color: rgba(255,255,255,.55); margin-top: 26px; letter-spacing: 1px; direction: ltr; }
.title .chips { display: flex; gap: 14px; margin-top: 40px; }
.title .chip { padding: 14px 26px; border-radius: 40px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); font-size: 26px; }
</style>
</head>
<body>
<div id="bg" class="hidden">
  <svg width="1920" height="1080"><defs><pattern id="p" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="currentColor" stroke-width="1.4" transform="translate(48 48)">
      <rect x="-28" y="-28" width="56" height="56"/><rect x="-28" y="-28" width="56" height="56" transform="rotate(45)"/><circle r="12"/></g>
  </pattern></defs><rect width="1920" height="1080" fill="url(#p)" style="color:#9fb3c8"/></svg>
  <div class="vignette"></div>
</div>
<div id="frame" class="hidden"><div class="body"></div><div class="rim"></div><div class="inner"></div><div class="island"></div>
  <div class="btn" style="right:-3px;top:250px;height:110px"></div><div class="btn" style="left:-3px;top:220px;height:60px"></div><div class="btn" style="left:-3px;top:300px;height:90px"></div></div>
<div id="mask" class="hidden"></div>
<div id="cap" class="cap hidden"><div class="eyebrow" id="cap-eyebrow"></div><h1 id="cap-title"></h1><p id="cap-sub"></p><div class="feats" id="cap-feats"></div></div>
<div id="title" class="title hidden"><img src="../../assets/images/app_icon.png"><div class="name">نور</div><div class="tag" id="t-tag"></div><div class="chips" id="t-chips"></div><div class="sub" id="t-sub"></div></div>
<script>
const q = new URLSearchParams(location.search);
const what = q.get('w');
const el = document.getElementById(what === 'bg-light' ? 'bg' : what);
el.classList.remove('hidden');
if (what === 'bg-light') el.classList.add('light');
if (what === 'cap') {
  if (q.get('light')) el.classList.add('light');
  document.getElementById('cap-eyebrow').textContent = q.get('e') || '';
  document.getElementById('cap-title').innerHTML = (q.get('t') || '').replace(/\|/g, '<br>');
  document.getElementById('cap-sub').textContent = q.get('s') || '';
  for (const f of (q.get('f') || '').split('،').filter(Boolean)) {
    const d = document.createElement('div'); d.className = 'feat'; d.textContent = f.trim();
    document.getElementById('cap-feats').appendChild(d);
  }
}
if (what === 'title') {
  document.getElementById('t-tag').textContent = q.get('tag') || '';
  document.getElementById('t-sub').textContent = q.get('sub') || '';
  for (const f of (q.get('chips') || '').split('،').filter(Boolean)) {
    const d = document.createElement('div'); d.className = 'chip'; d.textContent = f.trim();
    document.getElementById('t-chips').appendChild(d);
  }
}
document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
