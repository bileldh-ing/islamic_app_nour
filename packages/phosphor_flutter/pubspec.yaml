name: phosphor_flutter
description: Vendored slim Phosphor icons (Regular, Fill, Bold) for Noor.
version: 2.1.0+noor
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
